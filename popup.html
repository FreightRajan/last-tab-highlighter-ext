<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Last Tab Highlighter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>Last Tab Highlighter</h1>
    <p class="desc">When you switch away from a tab, its title gets a <strong>&#9664; HERE</strong> prefix so you can find it again. Return to the tab to clear it.</p>

    <button id="clear-btn">Clear marker</button>

    <p id="status" aria-live="polite"></p>

    <script src="popup.js"></script>
</body>
</html>
