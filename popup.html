<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Last Tab Highlighter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>Last Tab Highlighter</h1>
    <p class="desc">When you switch away from a tab, its favicon and title strobe so you don't lose your place. Return to the tab to stop.</p>

    <fieldset>
        <legend>RGB effect</legend>

        <label class="row">
            <input type="radio" name="effect" value="strobe" id="effect-strobe">
            <span><strong>Classic strobe</strong> — 6-color cycle, ~700ms</span>
        </label>
        <label class="row">
            <input type="radio" name="effect" value="smooth" id="effect-smooth">
            <span><strong>Smooth rainbow</strong> — full hue rotation</span>
        </label>
        <label class="row">
            <input type="radio" name="effect" value="off" id="effect-off">
            <span><strong>Off</strong> — no effect</span>
        </label>
    </fieldset>

    <button id="clear-btn">Stop strobe</button>

    <p id="status" aria-live="polite"></p>

    <script src="popup.js"></script>
</body>
</html>
