<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Last Tab Highlighter</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>Last Tab Highlighter</h1>
    <p class="desc">When you switch away from a tab, its favicon and title strobe through cycling colors. Return to the tab to stop it.</p>

    <button id="clear-btn">Stop strobe</button>

    <p id="status" aria-live="polite"></p>

    <script src="popup.js"></script>
</body>
</html>
